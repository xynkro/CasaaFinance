name: IBKR Flex Sync — Headless Positions

# Daily headless position sync for BOTH books via the IBKR Flex Web Service:
# token + query id, no TWS, no gateway, no login. Writes the PortfolioGrab JSON
# and pushes it through `sync.py grab` (positions_/snapshot_ caspar + sarah and
# the options tab).
#
# Caspar (USD base) is always fresh from IB_FLEX_TOKEN / IB_FLEX_QUERY_ID.
# Sarah (SGD base) is fresh from Flex too as soon as EITHER
#   - her account is added to Caspar's query (accounts linked under one login;
#     the script splits the report by accountId, no extra secret needed), OR
#   - the optional secrets IB_FLEX_TOKEN_SARAH + IB_FLEX_QUERY_ID_SARAH are set
#     (her own login / her own query).
# Until then — or whenever her data is missing, incomplete or unfetchable — she
# is carried forward: her Sheet rows are left untouched (this runner has no
# PortfolioGrabs/ to carry from, and sync.py skips an empty account) and
# Caspar's sync still completes. The job's exit code is Caspar's. The script
# prints one "sarah: ..." line saying which happened, with no values. Setup:
# docs/runbooks/ibkr-flex-both-books.md.
#
# Flex is END-OF-DAY data (statements update once a day), so a trade or deposit
# shows up the next morning; intraday prices are re-marked by the Yahoo job.
#
# 09:08 UTC = 5:08 AM EDT / 4:08 AM EST: overnight EOD statements are settled,
# and it is well clear of IBKR's flaky pre-market regeneration window (~12:30-14:00 UTC,
# observed 1001s on 06-09 and 06-10). The local launchd ibkr-grab (TWS, every
# 30 min when running) remains the intraday/authoritative path; this cron is
# the zero-touch daily floor so the book is never days stale again.

on:
  schedule:
    - cron: "8 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ibkr-flex-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      IB_FLEX_TOKEN:    ${{ secrets.IB_FLEX_TOKEN }}
      IB_FLEX_QUERY_ID: "1501198"
      # Optional — Sarah's own Flex login. Unset secrets expand to "" and the
      # script then ignores them (inert until BOTH are set).
      IB_FLEX_TOKEN_SARAH:    ${{ secrets.IB_FLEX_TOKEN_SARAH }}
      IB_FLEX_QUERY_ID_SARAH: ${{ secrets.IB_FLEX_QUERY_ID_SARAH }}
      OAUTH_TOKEN_JSON: ${{ secrets.OAUTH_TOKEN_JSON }}
      SHEET_ID:         ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Flex sync (retry through IBKR's transient 1001s)
        run: |
          for attempt in 1 2 3; do
            echo "=== attempt $attempt ==="
            if python scripts/ibkr_flex_sync.py --sync; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 720
          done
          echo "Flex statement never generated — leaving last-good positions in place."
          exit 1
