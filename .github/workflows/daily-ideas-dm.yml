name: Daily Ideas DM — pre-open plan and post-open re-check

# The daily Telegram DM of sized buy/sell ideas, one section per book
# (scripts/daily_ideas_dm.py). Every idea is re-checked on live prices, sized for
# each book, and shown with its source's graded record vs SPY. It names account
# cash, so it goes to the personal DM lane only.
#
# Schedule: deploy/vm/casaa_dispatch.py on the GCP VM starts this at 08:45 ET (the
# plan) and 09:47 ET (the re-check), because GitHub's cron runs land hours late.
# The cron below is only a backstop and the script decides what a run does:
#   08:00-09:29 ET  send the plan if it hasn't gone
#   09:40-11:30 ET  send the re-check if it hasn't gone (`ideas_log` is the ledger)
#   after 11:30 ET  warn once if nothing went out today, so a dead timer can't stay silent
#
# Required secrets: OAUTH_TOKEN_JSON, SHEET_ID, TELEGRAM_BOT_TOKEN
# (TELEGRAM_CHAT_ID optional — the personal lane resolves to the owner's DM and
# refuses any group id.)

on:
  schedule:
    - cron: "45 13,14 * * 1-5"
    - cron: "15 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry:
        description: "Build the DM without sending it (not printed: job logs are public)"
        type: boolean
        default: true
      force:
        description: "Send even outside the window / if already sent today"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # to start the Firestore mirror right after a send

concurrency:
  group: daily-ideas-dm
  cancel-in-progress: false

jobs:
  dm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OAUTH_TOKEN_JSON:   ${{ secrets.OAUTH_TOKEN_JSON }}
      SHEET_ID:           ${{ secrets.SHEET_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      GROWTH_LEG_ENABLED: ${{ vars.GROWTH_LEG_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build and send the ideas DM
        id: dm
        run: |
          ARGS=""
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/daily_ideas_dm.py $ARGS

      - name: Copy the list to the app now (the mirror's own schedule runs hours late)
        if: steps.dm.outputs.sent == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mirror-firestore.yml --repo "$GITHUB_REPOSITORY"
